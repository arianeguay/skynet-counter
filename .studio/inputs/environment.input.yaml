# Feeds for the écologie domain. Measured on 2026-09-02 (STU-1218): every one
# below returned items and contributed score. Two candidates are deliberately
# absent — heatmap.news/feed answered 404, and The Verge's climate feed parsed
# zero items.
run: scheduled

feeds:
  - source: Data Center Dynamics
    url: https://www.datacenterdynamics.com/en/rss/
  - source: Canary Media
    url: https://www.canarymedia.com/rss.xml
  - source: Carbon Brief
    url: https://www.carbonbrief.org/feed/
  - source: Grist
    url: https://grist.org/feed/
  - source: Inside Climate News
    url: https://insideclimatenews.org/feed/
  # The only source here that is not climate trade press. Filtered on the compute
  # side of the beat rather than the climate side, which is where this domain's
  # stories actually break.
  - source: HN datacenter energy
    url: https://hnrss.org/newest?q=datacenter+OR+%22data+center%22+OR+emissions+OR+%22power+grid%22&points=50
  # The first French sources on any domain, added 2026-09-08 (STU-1292). Both are
  # general fils — environnement covers the whole climate beat, techno covers all
  # of technology — so neither is filtered on this domain's subject at the source.
  # The subject gate is what makes them safe: an article naming no AI and no
  # centre de données reaches the scorer with nothing to score. Until that gate
  # learned French it ran backwards on these, passing a déversement on "j'ai" and
  # failing a story about l'IA.
  #
  # Not measured against the probe: the sandbox this was added from has no egress
  # to the feeds. If either URL is wrong the sweep does not fail — `fetch-feed`
  # emits an empty batch with the reason and the source shows up in FeedAlert.
  - source: Radio-Canada environnement
    url: https://ici.radio-canada.ca/info/rss/environnement/en-continu
  - source: Radio-Canada techno
    url: https://ici.radio-canada.ca/info/rss/techno/en-continu
