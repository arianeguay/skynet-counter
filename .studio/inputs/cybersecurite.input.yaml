# The pipeline pulls everything else from the feeds and from SQLite; the input
# exists to carry this list, which the `fetch` map stage fans out over. Adding a
# feed is two lines here and nothing else — the sub-pipeline reads `source` and
# `url` off the item.
#
# One input file per domain, named for its slug. The rest of a domain's config —
# keyword weights, scoring guidance, divisor — lives in
# `src/lib/domains/<slug>.ts`, because only the feed list has to be reachable from
# YAML: Studio fans the map stage out over it and cannot read TypeScript. The
# sweep is told which domain it is running by `SKYNET_DOMAIN`, not by this file.
run: scheduled

feeds:
  - source: Ars Technica Security
    url: https://arstechnica.com/security/feed
  - source: The Hacker News
    url: https://thehackernews.com/feeds/posts/default
  - source: Krebs on Security
    url: https://krebsonsecurity.com/feed/
  # Added 2026-09-11, unmeasured — no egress to the publishers from the sandbox
  # this went in from, the same position STU-1292 shipped Radio-Canada's fils in.
  # All three are incident newsrooms on this exact beat, so they need no subject
  # list; what they change is volume. They pushed the feed set from 97 to 204
  # points of score a day, and the divisor in `cybersecurite.ts` went from 32 to
  # 64, confirmed by `bun run calibrate` on 2026-10-06 (STU-1491).
  - source: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
  - source: The Record
    url: https://therecord.media/feed
  - source: Dark Reading
    url: https://www.darkreading.com/rss.xml
  # The breadth-hedge Hacker News feed (hnrss.org, AI/LLM/agent/exploit query)
  # was removed here on 2026-09-11 (STU-1272). STU-1221 kept it on two readings
  # a day apart, both 2 of 25 above zero, on the reasoning that it was the only
  # non-security-trade-press source. The re-check that reasoning called for: a
  # third reading after the corpus turned over (52 articles over its 14.1-day
  # window) still gave 3.1 of 231.7 points of score a day, 1.3% of the signal —
  # under the 2% floor the issue set for keeping the seat. Removed the way Ars
  # Technica AI was on the same measurement (STU-1221).
