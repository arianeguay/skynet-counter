name: counter-output
version: 1
schema:
  required_fields:
    - counter
    - updatedAt
    - articles
    - feedErrors
  fields:
    counter:
      type: number
    updatedAt:
      type: string
    articles:
      type: array
      items:
        type: object
        required_fields:
          - title
          - url
          - source
          - date
          - score
    feedErrors:
      type: array
      items:
        type: object
        required_fields:
          - source
          - error
          - since
