name: score-validation
version: 1
schema:
  required_fields:
    - status
    - summary
    - issues
  fields:
    status:
      type: string
      enum: [approved, rejected]
    issues:
      type: array
post_validation:
  rejection_detection:
    field: status
    approved_values:
      - approved
    rejected_values:
      - rejected
    details_field: issues
    summary_field: summary
    reject_if_non_empty: issues
