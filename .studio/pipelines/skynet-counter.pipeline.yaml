name: skynet-counter
description: Scrape AI-risk news, score it against weighted keywords, and recompute the 0-100 Skynet counter
version: 1

stages:
  # One sub-pipeline run per feed. The list is the pipeline input's, so adding a
  # feed is a `<domain>.input.yaml` edit and nothing else — the five near-identical
  # stages this replaced had to keep their names in step with a table in
  # fetch-feed.ts, and every hourly sweep failed the once they did not (STU-1191).
  - map: fetch
    over: input.feeds
    pipeline: fetch-feed
    concurrency: 5
    on_item_failure: collect-all

  - name: dedupe
    kind: filter
    executor: script
    script: .studio/scripts/dedupe.ts
    runtime: node
    timeout_ms: 30000
    contract: new-articles
    ralph:
      max_attempts: 1
    context:
      include:
        - all_stage_outputs

  - group: scoring
    max_iterations: 3
    stages:
      - name: score
        kind: scoring
        condition: stages.dedupe.output.new_count > 0
        agent: scorer
        contract: scored-articles
        ralph:
          max_attempts: 3
        context:
          include:
            - all_stage_outputs
            - group_feedback

      - name: validate-scores
        kind: qa
        condition: stages.dedupe.output.new_count > 0
        executor: script
        script: .studio/scripts/validate-scores.ts
        runtime: node
        timeout_ms: 30000
        contract: score-validation
        ralph:
          max_attempts: 1
        context:
          include:
            - all_stage_outputs

  - name: aggregate
    kind: aggregation
    executor: script
    script: .studio/scripts/aggregate.ts
    runtime: node
    timeout_ms: 30000
    contract: counter-output
    ralph:
      max_attempts: 1
    context:
      include:
        - all_stage_outputs
